<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Analyzer X</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0b1020;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 600px;
      margin: auto;
    }

    h1 {
      text-align: center;
      margin-bottom: 5px;
    }

    .subtitle {
      text-align: center;
      color: #9ca3af;
      margin-bottom: 25px;
    }

    .card {
      background: #151c32;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
    }

    .stat {
      background: #202943;
      padding: 15px 8px;
      border-radius: 14px;
      text-align: center;
    }

    .stat span {
      display: block;
      color: #9ca3af;
      font-size: 13px;
      margin-bottom: 7px;
    }

    .stat strong {
      font-size: 20px;
    }

    input {
      width: 100%;
      padding: 15px;
      border-radius: 12px;
      border: none;
      outline: none;
      font-size: 17px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 12px;
      background: #e63946;
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .analysis {
      text-align: center;
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
    }

    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 15px;
    }

    .result {
      background: #202943;
      padding: 9px 12px;
      border-radius: 10px;
      font-weight: bold;
    }

    .message {
      text-align: center;
      margin-top: 12px;
      color: #9ca3af;
      font-size: 14px;
    }

    .warning {
      text-align: center;
      color: #fbbf24;
      font-size: 12px;
      margin-top: 20px;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>✈️ Aviator Analyzer X</h1>
  <div class="subtitle">
    Painel de análise estatística de resultados
  </div>

  <div class="card stats">

    <div class="stat">
      <span>Rodadas</span>
      <strong id="rounds">0</strong>
    </div>

    <div class="stat">
      <span>Média</span>
      <strong id="average">0.00x</strong>
    </div>

    <div class="stat">
      <span>Maior</span>
      <strong id="highest">0.00x</strong>
    </div>

  </div>

  <div class="card">

    <h3>Adicionar resultado</h3>

    <input
      type="number"
      id="multiplier"
      placeholder="Ex.: 2.50"
      step="0.01"
      min="1"
    >

    <button id="addButton" onclick="addRound()">
      Adicionar rodada
    </button>

    <div class="message" id="message"></div>

  </div>

  <div class="card">

    <h3>Análise</h3>

    <div class="analysis" id="analysis">
      Aguardando resultados...
    </div>

  </div>

  <div class="card">

    <h3>Histórico</h3>

    <div class="history" id="history"></div>

  </div>

  <div class="warning">
    ⚠️ Esta ferramenta apresenta estatísticas dos resultados registrados.
    Ela não garante nem prevê o resultado da próxima rodada.
  </div>

</div>

<script>

  // ==========================================
  // SUPABASE
  // ==========================================

  const SUPABASE_URL =
    "https://duokvzlnwdeiawwdvtjf.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_j8BlaYuO-CA3gQkdPlM8Zw_14pqLVkN";


  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


  let multipliers = [];


  // ==========================================
  // CARREGAR RESULTADOS
  // ==========================================

  async function loadRounds() {

    const { data, error } = await supabaseClient
      .from("aviator_rounds")
      .select("id, multiplier, created_at")
      .order("created_at", { ascending: false })
      .limit(100);

    if (error) {

      console.error(error);

      document.getElementById("message").textContent =
        "Erro ao carregar os resultados.";

      return;
    }

    multipliers = data
      .reverse()
      .map(item => Number(item.multiplier));

    updatePanel();
  }


  // ==========================================
  // ADICIONAR RESULTADO
  // ==========================================

  async function addRound() {

    const input =
      document.getElementById("multiplier");

    const button =
      document.getElementById("addButton");

    const message =
      document.getElementById("message");

    const value = Number(input.value);


    if (!value || value < 1) {

      message.textContent =
        "Digite um multiplicador válido. Ex.: 2.50";

      return;
    }


    button.disabled = true;

    message.textContent = "Salvando...";


    const { data, error } =
      await supabaseClient
        .from("aviator_rounds")
        .insert({
          multiplier: value
        })
        .select()
        .single();


    if (error) {

      console.error(error);

      message.textContent =
        "Não foi possível salvar o resultado.";

      button.disabled = false;

      return;
    }


    multipliers.push(
      Number(data.multiplier)
    );


    if (multipliers.length > 100) {
      multipliers.shift();
    }


    input.value = "";

    message.textContent =
      "Resultado salvo com sucesso!";


    updatePanel();

    button.disabled = false;
  }


  // ==========================================
  // ATUALIZAR PAINEL
  // ==========================================

  function updatePanel() {

    const rounds =
      multipliers.length;


    document.getElementById("rounds").textContent =
      rounds;


    if (rounds === 0) {

      document.getElementById("average").textContent =
        "0.00x";

      document.getElementById("highest").textContent =
        "0.00x";

      document.getElementById("analysis").textContent =
        "Aguardando resultados...";

      document.getElementById("history").innerHTML =
        "";

      return;
    }


    const total =
      multipliers.reduce(
        (sum, value) => sum + value,
        0
      );


    const average =
      total / rounds;


    const highest =
      Math.max(...multipliers);


    document.getElementById("average").textContent =
      average.toFixed(2) + "x";


    document.getElementById("highest").textContent =
      highest.toFixed(2) + "x";


    updateAnalysis();


    const history =
      document.getElementById("history");


    history.innerHTML = "";


    multipliers
      .slice()
      .reverse()
      .forEach(value => {

        const item =
          document.createElement("div");

        item.className = "result";

        item.textContent =
          value.toFixed(2) + "x";

        history.appendChild(item);

      });
  }


  // ==========================================
  // ANÁLISE DAS ÚLTIMAS 5
  // ==========================================

  function updateAnalysis() {

  const analysis = document.getElementById("analysis");

  if (multipliers.length === 0) {
    analysis.textContent = "Aguardando resultados...";
    return;
  }

  const last5 = multipliers.slice(-5);
  const last10 = multipliers.slice(-10);
  const last20 = multipliers.slice(-20);

  const average = values =>
    values.reduce((sum, value) => sum + value, 0) / values.length;

  const low = values =>
    values.filter(value => value < 2).length;

  const high = values =>
    values.filter(value => value >= 2).length;

  analysis.innerHTML = `
    <div style="font-size:16px; line-height:1.8;">
      📊 Média 5: <strong>${average(last5).toFixed(2)}x</strong><br>
      📊 Média 10: <strong>${average(last10).toFixed(2)}x</strong><br>
      📊 Média 20: <strong>${average(last20).toFixed(2)}x</strong><br>
      🔻 Abaixo de 2x: <strong>${low(last20)}</strong><br>
      🚀 2x ou mais: <strong>${high(last20)}</strong>
    </div>
  `;
}


  // ==========================================
  // INICIAR
  // ==========================================

  loadRounds();

</script>

</body>
</html>
