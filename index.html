<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Aviator Analyzer X</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #080b12;
      color: white;
      min-height: 100vh;
    }

    .container {
      width: 100%;
      max-width: 900px;
      margin: auto;
      padding: 20px;
    }

    header {
      text-align: center;
      padding: 25px 10px;
    }

    h1 {
      font-size: 30px;
      margin-bottom: 8px;
    }

    .subtitle {
      color: #9da5b4;
      font-size: 14px;
    }

    .card {
      background: #111722;
      border: 1px solid #202938;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 18px;
    }

    .card h2 {
      font-size: 18px;
      margin-bottom: 15px;
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .stat {
      background: #0b1019;
      border-radius: 12px;
      padding: 15px;
      text-align: center;
    }

    .stat span {
      display: block;
      color: #929aaa;
      font-size: 12px;
      margin-bottom: 8px;
    }

    .stat strong {
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 14px;
      border-radius: 10px;
      border: 1px solid #303949;
      background: #080b12;
      color: white;
      font-size: 16px;
      margin-bottom: 12px;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 10px;
      background: #ffffff;
      color: #000000;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:active {
      transform: scale(0.98);
    }

    .result {
      text-align: center;
      padding: 25px 10px;
    }

    .result .value {
      font-size: 42px;
      font-weight: bold;
      margin: 10px 0;
    }

    .status {
      color: #9da5b4;
      font-size: 14px;
    }

    .history {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .multiplier {
      padding: 9px 12px;
      border-radius: 8px;
      background: #1a2230;
      font-weight: bold;
      font-size: 14px;
    }

    footer {
      text-align: center;
      color: #697386;
      font-size: 12px;
      padding: 20px;
    }

    @media (max-width: 600px) {
      .stats {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 25px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>✈️ Aviator Analyzer X</h1>
      <p class="subtitle">
        Painel de análise estatística de resultados
      </p>
    </header>

    <div class="card">
      <h2>📊 Estatísticas</h2>

      <div class="stats">

        <div class="stat">
          <span>Rodadas</span>
          <strong id="rounds">0</strong>
        </div>

        <div class="stat">
          <span>Média</span>
          <strong id="average">0.00x</strong>
        </div>

        <div class="stat">
          <span>Maior</span>
          <strong id="highest">0.00x</strong>
        </div>

      </div>
    </div>

    <div class="card">

      <h2>➕ Adicionar resultado</h2>

      <input
        id="multiplierInput"
        type="number"
        step="0.01"
        min="1"
        placeholder="Ex.: 2.35"
      >

      <button onclick="addMultiplier()">
        Adicionar rodada
      </button>

    </div>

    <div class="card result">

      <h2>🎯 Análise</h2>

      <div class="value" id="analysis">
        Aguardando dados
      </div>

      <p class="status" id="status">
        Adicione alguns resultados para começar.
      </p>

    </div>

    <div class="card">

      <h2>📜 Histórico</h2>

      <div class="history" id="history">
        Nenhum resultado ainda.
      </div>

    </div>

  </div>

  <footer>
    Aviator Analyzer X — análise estatística
  </footer>

  <script>

    let multipliers = [];

    function addMultiplier() {

      const input = document.getElementById("multiplierInput");

      const value = parseFloat(input.value);

      if (!value || value < 1) {
        alert("Digite um multiplicador válido.");
        return;
      }

      multipliers.push(value);

      input.value = "";

      updatePanel();
    }

    function updatePanel() {

      const rounds = multipliers.length;

      const average =
        multipliers.reduce((a, b) => a + b, 0) / rounds;

      const highest =
        Math.max(...multipliers);

      document.getElementById("rounds").textContent =
        rounds;

      document.getElementById("average").textContent =
        average.toFixed(2) + "x";

      document.getElementById("highest").textContent =
        highest.toFixed(2) + "x";

      const history =
        document.getElementById("history");

      history.innerHTML = "";

      multipliers
        .slice()
        .reverse()
        .forEach(value => {

          const item =
            document.createElement("div");

          item.className = "multiplier";

          item.textContent =
            value.toFixed(2) + "x";

          history.appendChild(item);

        });

      analyze();
    }

    function analyze() {

      if (multipliers.length < 5) {

        document.getElementById("analysis").textContent =
          "Aguardando dados";

        document.getElementById("status").textContent =
          "Adicione pelo menos 5 resultados.";

        return;
      }

      const last =
        multipliers.slice(-5);

      const average =
        last.reduce((a, b) => a + b, 0) / last.length;

      document.getElementById("analysis").textContent =
        average.toFixed(2) + "x";

      document.getElementById("status").textContent =
        "Média das últimas 5 rodadas.";

    }

  </script>

</body>
</html>
